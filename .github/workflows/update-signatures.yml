name: Build and deploy signatures

on:
  workflow_dispatch:
  schedule:
    # UTC 03:17 = KST 12:17, 하루 한 번(예약 작업은 지연될 수 있음)
    - cron: '17 */6 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-signatures.yml'
      - 'safe-ur-link/scripts/**'
      - 'safe-ur-link/core/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-signatures
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    defaults:
      run:
        working-directory: safe-ur-link
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test
        run: npm test

      - name: Collect and build public feed
        env:
          ABUSE_CH_AUTH_KEY: ${{ secrets.ABUSE_CH_AUTH_KEY }}
          PHISHTANK_KEY: ${{ secrets.PHISHTANK_KEY }}
          PHISHTANK_USER_AGENT: ${{ vars.PHISHTANK_USER_AGENT }}
          PUBLISH_URLHAUS: 'true'
          PUBLISH_THREATFOX: 'true'
          PUBLISH_PHISHTANK: 'true'
          PUBLISH_OPENPHISH: 'true'
          REDISTRIBUTION_CONFIRMED: 'true'
          OPENPHISH_WRITTEN_PERMISSION: 'false'
        run: npm run build:feed

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: safe-ur-link/public
      - uses: actions/deploy-pages@v4
        id: deployment

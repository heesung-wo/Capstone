<!doctype html><html lang="ko"><meta charset="utf-8"><link rel="stylesheet" href="style.css">
<body class="popup"><main>
<h1>Safe UR Link</h1>
<form id="scanForm"><label for="url">URL 직접 검사</label><input id="url" type="url" placeholder="https://example.com" required><button>검사</button><button class="secondary" id="current" type="button">현재 페이지 검사</button></form>
<p id="message" role="status" class="muted"></p><section id="result" hidden></section>
<section class="panel"><h2>사용자 필터</h2><p class="muted">도메인을 입력하세요. 허용 목록은 차단보다 우선합니다.</p>
<input id="host" placeholder="example.test"><button id="block" type="button">차단 추가</button><button id="allow" class="secondary" type="button">허용 추가</button>
<h2>차단 목록</h2><ul id="blocks"></ul><h2>허용 목록</h2><ul id="allows"></ul></section>
</main><script src="ui.js"></script></body></html>

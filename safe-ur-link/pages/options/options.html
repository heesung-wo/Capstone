<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>SafeURLink 설정</title><link rel="stylesheet" href="../../assets/css/ui.css">
<style>body{max-width:680px;margin:30px auto;padding:0 20px}section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:16px 0}h2{font-size:15px;margin-bottom:8px}label{display:block;margin:10px 0 4px}textarea{height:90px}table{width:100%;border-collapse:collapse}td{padding:4px 0}.err{color:var(--red)}</style></head>
<body><h1>SafeURLink 설정</h1>
<section><h2>실시간 보호</h2><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="realtime" style="width:auto"> 위협 DB 시그니처는 직접 차단, 사용자 차단 도메인은 경고 페이지 표시</label>
<p class="muted" id="rc"></p>
<p class="muted" id="coverage"></p></section>
<section><h2>위협 정보 업데이트</h2>
<p class="muted">개발자가 매일 수집해 공개한 시그니처 데이터를 자동으로 받아옵니다. 업데이트된 시그니처는 접속 전 직접 차단에 사용됩니다(DB block 최대 29,700개, 사용자 차단 redirect 최대 300개, 전체 동적 DNR 30,000개). API 키를 입력할 필요가 없습니다.</p>
<div style="margin-top:12px"><button class="btn" id="sync">지금 업데이트</button> <span class="muted">6시간마다 자동 확인</span></div>
<table id="tbl"></table><p class="muted" id="note"></p></section>
<section><h2>허용 목록</h2><textarea id="allow" aria-label="허용 도메인" placeholder="한 줄에 도메인 하나 (예: example.com)"></textarea>
<h2 style="margin-top:14px">사용자 차단 목록 (경고 페이지로 이동, 최대 300개)</h2><textarea id="block" aria-label="차단 도메인" placeholder="한 줄에 도메인 하나"></textarea></section>
<button class="btn" id="save">설정 저장</button> <span id="msg" class="muted"></span>
<script type="module" src="options.js"></script></body></html>

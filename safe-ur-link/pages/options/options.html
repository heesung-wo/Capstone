<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>Safe UR Link 설정</title><link rel="stylesheet" href="../../assets/css/ui.css">
<style>body{max-width:680px;margin:30px auto;padding:0 20px}section{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin:16px 0}h2{font-size:15px;margin-bottom:8px}label{display:block;margin:10px 0 4px}textarea{height:90px}table{width:100%;border-collapse:collapse}td{padding:4px 0}.err{color:var(--red)}</style></head>
<body><h1>Safe UR Link 설정</h1>
<section><h2>실시간 보호</h2><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="realtime" style="width:auto"> 알려진 악성 URL 접속 전에 경고 페이지 표시</label>
<p class="muted" id="rc"></p></section>
<section><h2>위협 정보 업데이트</h2>
<label for="authKey">abuse.ch Auth-Key (URLhaus, ThreatFox)</label><input id="authKey" type="password" autocomplete="off">
<label for="phishKey">PhishTank 앱 키 (선택, 미입력 시 하루 1회 이하)</label><input id="phishKey" type="password" autocomplete="off">
<div style="margin-top:12px"><button class="btn" id="sync">지금 업데이트</button> <span class="muted">매시간 갱신 확인 · 소스별 갱신 제한 적용</span></div>
<table id="tbl"></table><p class="muted">URLhaus/ThreatFox는 무료 abuse.ch Auth-Key가 필수입니다. PhishTank는 앱 키 없이도 다운로드할 수 있으나 제한이 엄격하며, 브라우저 환경에서는 요청이 거절될 수 있습니다. 실패하면 저장된 이전 데이터는 유지됩니다.</p></section>
<section><h2>허용 목록</h2><textarea id="allow" aria-label="허용 도메인" placeholder="한 줄에 도메인 하나 (예: example.com)"></textarea>
<h2 style="margin-top:14px">차단 목록</h2><textarea id="block" aria-label="차단 도메인" placeholder="한 줄에 도메인 하나"></textarea></section>
<button class="btn" id="save">설정 저장</button> <span id="msg" class="muted"></span>
<script type="module" src="options.js"></script></body></html>

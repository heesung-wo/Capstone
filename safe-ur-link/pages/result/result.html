<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SafeURLink - 우클릭 URL 검사 결과</title>
  <link rel="stylesheet" href="../../assets/css/ui.css">
  <style>
    body { max-width: 760px; margin: 36px auto; padding: 0 20px; }
    .card { margin-top: 16px; padding: 20px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
    #target { padding: 12px; border-radius: 6px; background: var(--bg); word-break: break-all; white-space: pre-wrap; user-select: text; }
    #result { margin-top: 18px; }
  </style>
</head>
<body>
  <h1>SafeURLink · URL 검사 결과</h1>
  <p class="muted">드래그한 URL 텍스트 또는 링크의 실제 이동 주소를 방문하지 않고 검사합니다.</p>
  <div class="card">
    <h2 id="targetTitle" style="font-size:15px;margin-bottom:8px">검사 대상 주소</h2>
    <div id="target" aria-label="검사 대상 주소"></div>
    <div id="result" aria-live="polite">검사 중…</div>
  </div>
  <p class="muted" style="margin-top:16px">DB에 등록되지 않았다는 이유만으로 안전한 사이트라고 보장할 수는 없습니다.</p>
  <script type="module" src="result.js"></script>
</body>
</html>

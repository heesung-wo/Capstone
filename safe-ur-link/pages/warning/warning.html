<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>SafeURLink | 위험한 사이트 차단됨</title><link rel="stylesheet" href="../../assets/css/ui.css">
<style>body{max-width:640px;margin:8vh auto;padding:0 20px}h1{font-size:26px;color:var(--red);margin-bottom:6px}.url{padding:10px 12px;background:var(--card);border:1px solid var(--line);border-radius:6px;margin:14px 0}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}</style></head>
<body><p class="muted">SafeURLink 실시간 보호</p><h1>이 사이트로 이동하지 않는 것을 권장합니다</h1>
<p>사용자 차단 목록에 등록된 도메인이므로 접속 전에 경고 페이지로 이동했습니다.</p>
<div class="url break" id="url"></div><div id="info">분석 중…</div>
<div class="row"><button class="btn" id="back">안전하게 돌아가기</button><button class="btn danger" id="proceed">위험을 감수하고 이 URL 접속</button></div>
<p class="muted">예외 허용은 이 탭의 이 URL에만 적용되며 브라우저 세션 종료 시 사라집니다. 다른 경로나 탭은 계속 보호합니다.</p>
<p class="err" id="error" role="alert"></p>
<script type="module" src="warning.js"></script></body></html>
